name: MintAuth verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install verified local toolchains
        shell: pwsh
        run: ./scripts/install-jdks.ps1
      - name: Verify dependencies and test core
        shell: pwsh
        run: ./scripts/build.ps1 -Target core
      - name: Check release signing boundaries with synthetic keys only
        shell: pwsh
        run: node --test scripts/release-security.test.mjs
